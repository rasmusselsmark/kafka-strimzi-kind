apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-services-ingress
  namespace: kafka
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
  # Redpanda Console - access via http://console.127.0.0.1.nip.io
  - host: console.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redpanda-console
            port:
              number: 8080
  # Prometheus - access via http://prometheus.127.0.0.1.nip.io
  - host: prometheus.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-operator-kube-p-prometheus
            port:
              number: 9090
