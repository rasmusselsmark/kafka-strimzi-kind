kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true,kafka-node=1"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # Kafka external access (nodeport listener in manifests/kafka-cluster.yaml).
  # NodePort services are reachable on any node, so mapping them on the
  # control-plane is enough; kube-proxy forwards to the broker pod anywhere.
  - containerPort: 31092   # kafka bootstrap
    hostPort: 9092
    protocol: TCP
  - containerPort: 31093   # broker-0
    hostPort: 9093
    protocol: TCP
  - containerPort: 31094   # broker-1
    hostPort: 9094
    protocol: TCP
  - containerPort: 31095   # broker-2
    hostPort: 9095
    protocol: TCP
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "kafka-node=2"
- role: worker
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "kafka-node=3"
